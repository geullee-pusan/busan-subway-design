<!doctype html>
<meta charset="utf-8">
<title>승객 3D 묶기(개발용)</title>
<!-- scripts/passengers-pack.mjs가 Vite 서버로 이 페이지를 열어 쓴다. 게임에는 들어가지 않는다. -->
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/examples/jsm/loaders/FBXLoader.js';
import { mergeVertices } from 'three/examples/jsm/utils/BufferGeometryUtils.js';
import { SimplifyModifier } from 'three/examples/jsm/modifiers/SimplifyModifier.js';
import { buildHero } from '/src/ui/hero-model.js';

const toB64 = (typed) => {
  const b = new Uint8Array(typed.buffer, typed.byteOffset, typed.byteLength);
  let s = '';
  for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode(...b.subarray(i, i + 0x8000));
  return btoa(s);
};
const pack = (typed, type, norm = false) => ({ type, data: toB64(typed), ...(norm ? { norm: true } : {}) });
const boneKey = (name) => name.replace(/^mixamorig\d*:?/, '');
const sleep = (ms) => new Promise((ok) => setTimeout(ok, ms));

/**
 * 캐릭터 하나: 메시들을 몸 뼈대에 맞춰 합치고, 꼭짓점을 줄이고, 질감들을 한 장(칸마다 512px)으로 합친다.
 * @param {{file: string, targetVerts: number, skip: string[]}} job
 */
async function packPerson({ file, targetVerts, skip, atlasCell = 512 }) {
  const loader = new FBXLoader();
  const model = await loader.loadAsync(file);
  await sleep(1500); // 안에 든 질감 그림이 다 읽히기를 기다린다
  model.updateMatrixWorld(true);
  const meshes = [];
  model.traverse((o) => {
    if (o.isSkinnedMesh && !skip.some((s) => o.name.toLowerCase().includes(s))) meshes.push(o);
  });
  if (!meshes.length) throw new Error(`${file}: 뼈대 있는 메시가 없어요`);
  // 기준 메시: 뼈가 가장 많은 메시. 뼈대는 캐릭터의 뼈 전체(메시마다 쓰는 뼈만 담겨 있어서, 중간 뼈가 빠지면 아래 뼈가 엉뚱한 곳에 붙는다)
  const ref = meshes.reduce((a, b) => (b.skeleton.bones.length > a.skeleton.bones.length ? b : a));
  // 메시들이 쓰는 뼈와 그 윗 뼈만(파일에 뼈대가 두 벌 들어 있을 때가 있다)
  const used = new Set();
  for (const m of meshes) for (const b of m.skeleton.bones) for (let o = b; o?.isBone; o = o.parent) used.add(o);
  const bones = [];
  model.traverse((o) => {
    if (o.isBone && used.has(o)) bones.push(o);
  });
  const byName = new Map(bones.map((b, i) => [boneKey(b.name), i]));
  // 기준 자세(묶을 때 뼈의 자리): 메시 뼈대에 있으면 그 역행렬로, 없으면 부모 기준 자세 × 자기 자리
  const bindWorld = new Map();
  for (const m of meshes) m.skeleton.bones.forEach((b, i) => bindWorld.has(b) || bindWorld.set(b, m.skeleton.boneInverses[i].clone().invert()));
  const worldOf = (b) => {
    if (bindWorld.has(b)) return bindWorld.get(b);
    const parentWorld = b.parent?.isBone ? worldOf(b.parent) : ref.bindMatrixInverse.clone().multiply(b.parent ? b.parent.matrixWorld : new THREE.Matrix4());
    const w = parentWorld.clone().multiply(b.matrix);
    bindWorld.set(b, w);
    return w;
  };
  // 질감 칸: 서로 다른 그림마다 한 칸
  const images = [];
  const slotOf = (m) => {
    const img = (Array.isArray(m.material) ? m.material[0] : m.material).map?.image ?? null;
    if (!img) return -1;
    let k = images.indexOf(img);
    if (k < 0) k = images.push(img) - 1;
    return k;
  };
  const parts = [];
  for (const m of meshes) {
    const slot = slotOf(m);
    let g = m.geometry.clone();
    for (const name of Object.keys(g.attributes)) if (!['position', 'uv', 'skinIndex', 'skinWeight'].includes(name)) g.deleteAttribute(name);
    // 뼈 번호를 기준 뼈대 번호로
    const si = g.attributes.skinIndex;
    const own = m.skeleton.bones;
    const mapped = new Float32Array(si.count * 4);
    for (let i = 0; i < si.count; i++) for (let k = 0; k < 4; k++) mapped[i * 4 + k] = byName.get(boneKey(own[si.getComponent(i, k)]?.name ?? '')) ?? 0;
    g.setAttribute('skinIndex', new THREE.BufferAttribute(mapped, 4));
    g = mergeVertices(g, 1e-4);
    parts.push({ g, slot, verts: g.attributes.position.count, name: m.name });
  }
  const total = parts.reduce((n, p) => n + p.verts, 0);
  // 꼭짓점 줄이기: 메시마다 같은 비율로
  const simplifier = new SimplifyModifier();
  const ratio = Math.min(1, targetVerts / total);
  for (const p of parts) {
    const remove = Math.floor(p.verts * (1 - ratio));
    if (remove > 0) p.g = await simplifier.modify(p.g, remove);
  }
  // 합치기(질감 칸에 맞춰 uv를 옮긴다)
  const n = Math.max(1, images.length);
  const pos = [];
  const uv = [];
  const sIdx = [];
  const sW = [];
  const index = [];
  let base = 0;
  for (const p of parts) {
    const a = p.g.attributes;
    for (let i = 0; i < a.position.count; i++) {
      pos.push(a.position.getX(i), a.position.getY(i), a.position.getZ(i));
      const u = a.uv ? a.uv.getX(i) : 0.5;
      const v = a.uv ? a.uv.getY(i) : 0.5;
      const fu = u - Math.floor(u);
      const fv = v - Math.floor(v);
      uv.push(((p.slot < 0 ? 0 : p.slot) + fu) / n, fv);
      for (let k = 0; k < 4; k++) {
        sIdx.push(a.skinIndex.getComponent(i, k));
        sW.push(a.skinWeight.getComponent(i, k));
      }
    }
    const idx = p.g.index.array;
    for (let i = 0; i < idx.length; i++) index.push(idx[i] + base);
    base += a.position.count;
  }
  // 무게 합을 255로
  const w8 = new Uint8Array(sW.length);
  for (let i = 0; i < sW.length; i += 4) {
    const s = sW[i] + sW[i + 1] + sW[i + 2] + sW[i + 3] || 1;
    let acc = 0;
    for (let k = 0; k < 3; k++) {
      w8[i + k] = Math.round((sW[i + k] / s) * 255);
      acc += w8[i + k];
    }
    w8[i + 3] = Math.max(0, 255 - acc);
  }
  const positions = new Float32Array(pos);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const box = new THREE.Box3().setFromBufferAttribute(geo.attributes.position);
  // 질감 한 장
  const cv = document.createElement('canvas');
  cv.width = atlasCell * n;
  cv.height = atlasCell;
  const ctx = cv.getContext('2d');
  images.forEach((img, k) => ctx.drawImage(img, k * atlasCell, 0, atlasCell, atlasCell));
  const flipY = (Array.isArray(ref.material) ? ref.material[0] : ref.material).map?.flipY ?? true;
  const inv = new Float32Array(bones.length * 16);
  bones.forEach((b, i) => inv.set(worldOf(b).clone().invert().elements, i * 16));
  const rootBone = bones.find((b) => !b.parent?.isBone);
  const idxOf = new Map(bones.map((b, i) => [b, i]));
  return {
    data: {
      bones: bones.map((b) => ({ name: b.name, parent: idxOf.has(b.parent) ? idxOf.get(b.parent) : -1, p: b.position.toArray(), q: b.quaternion.toArray(), s: b.scale.toArray() })),
      boneInverses: pack(inv, 'f32'),
      armatureMatrix: rootBone.parent.matrixWorld.toArray(),
      meshMatrix: ref.matrixWorld.toArray(),
      bindMatrix: ref.bindMatrix.toArray(),
      geometry: {
        position: pack(positions, 'f32'),
        uv: pack(Uint16Array.from(uv, (x) => Math.round(Math.max(0, Math.min(1, x)) * 65535)), 'u16', true),
        skinIndex: pack(Uint8Array.from(sIdx), 'u8'),
        skinWeight: pack(w8, 'u8', true),
        index: base < 65536 ? pack(Uint16Array.from(index), 'u16') : pack(Uint32Array.from(index), 'u32'),
      },
      textureFlipY: flipY,
      height: box.max.y - box.min.y,
      floor: box.min.y,
      center: box.getCenter(new THREE.Vector3()).toArray(),
      clips: [],
    },
    texture: cv.toDataURL('image/webp', 0.85),
    report: { file, meshes: parts.map((p) => p.name), before: total, after: base, tris: index.length / 3, bones: bones.length, textures: images.map((i) => `${i.width}x${i.height}`) },
  };
}

/** 동작 하나(Mixamo, 뼈대 이름으로 맞춘다). 엉덩이 자리 움직임은 뺀다(그 자리에서 움직인다). 앉는 동작(이름에 sit)은 엉덩이 자리를 남긴다(의자 높이로 내려앉는다) */
async function packClip({ name, file }, fps, maxSec) {
  const g = await new FBXLoader().loadAsync(file);
  const clip = g.animations[0];
  const duration = Math.min(clip.duration, maxSec);
  const tracks = [];
  for (const t of clip.tracks) {
    const dot = t.name.lastIndexOf('.');
    const node = t.name.slice(0, dot);
    const prop = t.name.slice(dot + 1);
    const keepHip = prop === 'position' && name.includes('sit') && boneKey(node) === 'Hips';
    if (prop !== 'quaternion' && !keepHip) continue;
    const n = Math.max(2, Math.round(duration * fps) + 1);
    const interp = t.createInterpolant();
    if (keepHip) {
      const v = new Float32Array(n * 3);
      for (let k = 0; k < n; k++) v.set(interp.evaluate(Math.min(duration, k / fps)), k * 3);
      tracks.push({ bone: 'Hips', prop: 'position', kind: 'v', fps, n, values: pack(v, 'f32') });
      continue;
    }
    const values = new Float32Array(n * 4);
    for (let k = 0; k < n; k++) values.set(interp.evaluate(Math.min(duration, k / fps)), k * 4);
    for (let k = 0; k < n; k++) new THREE.Quaternion().fromArray(values, k * 4).normalize().toArray(values, k * 4);
    const v16 = Int16Array.from(values, (x) => Math.round(Math.max(-1, Math.min(1, x)) * 32767));
    tracks.push({ bone: boneKey(node), kind: 'q', fps, n, values: pack(v16, 'i16') });
  }
  return { name, duration, tracks };
}

window.packAll = async ({ people, clips, fps, maxSec }) => {
  const out = [];
  for (const p of people) out.push(await packPerson(p));
  const packedClips = [];
  for (const c of clips) packedClips.push(await packClip(c, fps, maxSec));
  // 확인용 그림
  const shots = [];
  const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  r.setSize(200, 300);
  r.outputColorSpace = THREE.SRGBColorSpace;
  for (const p of out) {
    const image = await new Promise((ok) => {
      const im = new Image();
      im.onload = () => ok(im);
      im.src = p.texture;
    });
    const data = { ...p.data, clips: packedClips };
    const person = buildHero(data, image);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x8899aa);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 2.2));
    const sun = new THREE.DirectionalLight(0xffffff, 1.6);
    sun.position.set(1, 2, 2);
    scene.add(sun, person.root);
    const mixer = new THREE.AnimationMixer(person.root);
    // 확인용: 앉는 동작이 있으면 그것으로(의자 높이 확인)
    const show = packedClips.find((c) => c.name.includes('sit')) ?? packedClips[0];
    if (show) mixer.clipAction(person.clips[show.name]).play();
    mixer.update(0.5);
    const cam = new THREE.PerspectiveCamera(30, 200 / 300, 0.1, 20);
    cam.position.set(0, 0.55, 2.6);
    cam.lookAt(0, 0.5, 0);
    r.render(scene, cam);
    shots.push(r.domElement.toDataURL('image/jpeg', 0.85));
  }
  return { people: out.map((p) => ({ data: p.data, texture: p.texture, report: p.report })), clips: packedClips, shots };
};
window.ready = true;
</script>
