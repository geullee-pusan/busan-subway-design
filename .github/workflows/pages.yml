# GitHub Pages에 올린다. 태블릿에서 홈 화면에 깔려면 https 주소가 있어야 한다(docs/SPEC.md 11장).
#
# 쓰려면: 저장소 Settings → Pages → Source를 "GitHub Actions"로 바꾼다.
# 그다음부터 main이나 master에 푸시하면 자동으로 올라간다.
name: Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 올리는 데 필요한 권한만 준다.
permissions:
  contents: read
  pages: write
  id-token: write

# 한 번에 하나만 올린다. 진행 중인 것은 끝까지 두고 기다린다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
